<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verkehrssicherungs-Kontrolle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VS-Kontrolle">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<style>
  :root{
    --asphalt:#1f2226;
    --anthracite:#2b2f35;
    --paper:#ffffff;
    --offwhite:#f4f3f0;
    --line:#dcdad4;
    --ink:#1c1c1c;
    --ink-soft:#5a5a5a;
    --accent:#e2570d;
    --accent-ink:#7a2c05;
    --ok:#3c7a52;
    --danger:#b23a2e;
    --radius:2px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --offwhite:#15171a;
      --paper:#1e2023;
      --line:#33363b;
      --ink:#f2f0ec;
      --ink-soft:#a8a6a1;
    }
  }
  :root[data-theme="dark"]{
    --offwhite:#15171a;
    --paper:#1e2023;
    --line:#33363b;
    --ink:#f2f0ec;
    --ink-soft:#a8a6a1;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--offwhite);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  .topbar{
    background:var(--asphalt);
    color:#fff;
    padding:14px 18px calc(14px + env(safe-area-inset-top,0px)/0);
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:3px solid var(--accent);
  }
  .topbar .mark{
    width:10px;height:10px;background:var(--accent);flex:0 0 auto;
  }
  .topbar h1{font-size:20px;color:#fff;line-height:1.1;}
  .topbar .sub{font-size:12px;color:#b9bcc0;margin-top:1px;}
  main{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
  .screen{display:none;}
  .screen.active{display:block;}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 6px;
    text-transform:none;
  }
  .field{margin-bottom:18px;}
  input[type="text"]{
    width:100%;
    padding:13px 12px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:var(--offwhite);
    border:1px solid var(--line);
    border-radius:var(--radius);
  }
  input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:1px;}

  button{font-family:inherit;cursor:pointer;}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    padding:15px 18px;
    font-size:16px;
    font-weight:600;
    border-radius:var(--radius);
    border:1px solid transparent;
    min-height:52px;
  }
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:disabled{background:#c9c3ba;border-color:#c9c3ba;color:#847e73;cursor:not-allowed;}
  .btn-dark{background:var(--asphalt);color:#fff;}
  .btn-outline{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn-text{background:none;border:none;color:var(--ink-soft);font-size:14px;padding:10px;font-weight:600;}

  .intro{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-bottom:22px;}

  /* capture screen */
  .session-strip{
    background:var(--asphalt);
    color:#fff;
    padding:12px 16px;
    font-size:13px;
    line-height:1.5;
    border-bottom:3px solid var(--accent);
  }
  .session-strip b{color:#fff;}
  .session-strip .row{display:flex;justify-content:space-between;gap:10px;color:#c7cacd;}

  .capture-actions{margin:18px 0;}
  .count-line{
    display:flex;justify-content:space-between;align-items:baseline;
    margin:22px 0 10px;
  }
  .count-line h2{font-size:20px;}
  .count-line span{font-size:13px;color:var(--ink-soft);}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .thumb{
    position:relative;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--paper);
    aspect-ratio:4/3;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .del{
    position:absolute;top:6px;right:6px;
    width:26px;height:26px;
    background:rgba(20,20,20,0.75);
    color:#fff;border:none;border-radius:50%;
    font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .thumb .retry-loc{
    position:absolute;left:6px;right:6px;bottom:6px;
    background:rgba(20,20,20,0.8);
    color:#fff;border:1px solid var(--accent);border-radius:var(--radius);
    font-size:11px;font-weight:600;padding:6px 4px;
  }
  .empty-state{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:28px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .sticky-bottom{
    position:sticky;
    bottom:calc(0px + env(safe-area-inset-bottom,0px));
    margin-top:26px;
    padding-top:14px;
    background:linear-gradient(to top, var(--offwhite) 60%, transparent);
  }
  .status-line{
    font-size:13px;color:var(--ink-soft);margin-top:10px;text-align:center;min-height:18px;
  }
  .status-line.err{color:var(--danger);}
  .status-line.ok{color:var(--ok);}

  /* done screen */
  .done-icon{
    width:52px;height:52px;background:var(--ok);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;border-radius:50%;margin-bottom:16px;
  }
  .summary-row{
    display:flex;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row span:first-child{color:var(--ink-soft);}

  @media (max-width:380px){
    .topbar h1{font-size:18px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="mark"></div>
  <div>
    <h1>Franz Schelle GmbH &amp; Co. KG</h1>
    <div class="sub">Verkehrssicherungs-Kontrolle</div>
  </div>
</div>

<main>

  <!-- START -->
  <section class="screen active" id="screen-start">
    <div class="card">
      <p class="intro">Angaben zur Kontrolle erfassen, dann Kontrolle starten. Jedes Foto wird automatisch mit Datum, Uhrzeit und GPS-Koordinaten gekennzeichnet.</p>
      <div class="field">
        <label for="in-erfasser">Erfasser/in</label>
        <input type="text" id="in-erfasser" autocomplete="off" placeholder="Name">
      </div>
      <div class="field">
        <label for="in-baustelle">Baustelle</label>
        <input type="text" id="in-baustelle" autocomplete="off" placeholder="Bezeichnung / Adresse">
      </div>
      <div class="field" style="margin-bottom:22px;">
        <label for="in-kostenstelle">Kostenstelle</label>
        <input type="text" id="in-kostenstelle" autocomplete="off" placeholder="Kostenstellen-Nr.">
      </div>
      <button class="btn btn-primary" id="btn-start" disabled>Start Kontrolle</button>
      <div class="status-line" id="start-status"></div>
    </div>
  </section>

  <!-- CAPTURE -->
  <section class="screen" id="screen-capture">
  </section>

  <!-- DONE -->
  <section class="screen" id="screen-done">
    <div class="card">
      <div class="done-icon">✓</div>
      <h2 style="font-size:22px;margin-bottom:14px;">Bericht erstellt</h2>
      <div id="done-summary"></div>
      <button class="btn btn-primary" id="btn-new" style="margin-top:22px;">Neue Kontrolle starten</button>
    </div>
  </section>

</main>

<input type="file" accept="image/*" capture="environment" id="camera-input" style="display:none;">
<input type="file" accept="image/*" id="gallery-input" style="display:none;">

<script>
(function(){
  "use strict";

  // ---------- state ----------
  var session = null;      // {erfasser, baustelle, kostenstelle}
  var photos = [];         // {dataUrl, dateStr, locStr, takenAt}
  var pendingLocationPromise = null;
  var busy = false;

  // ---------- helpers ----------
  function pad(n){ return String(n).padStart(2,'0'); }

  function formatDateTime(d){
    return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes())+' Uhr';
  }
  function formatDateTimeShort(d){
    return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function formatLocation(coords){
    if(!coords) return 'Standort nicht verfügbar';
    var lat = coords.latitude.toFixed(5);
    var lon = coords.longitude.toFixed(5);
    var acc = coords.accuracy ? (' (\u00b1' + Math.round(coords.accuracy) + ' m)') : '';
    return 'Standort: ' + lat + ', ' + lon + acc;
  }

  // resolves { coords, errorCode, errorMsg } — never rejects, but always reports what happened
  function getLocation(timeoutMs){
    timeoutMs = timeoutMs || 12000;
    return new Promise(function(resolve){
      if(!navigator.geolocation){
        resolve({ coords:null, errorCode:'unsupported', errorMsg:'Geolocation wird von diesem Browser nicht unterstützt.' });
        return;
      }
      var done = false;
      var timer = setTimeout(function(){
        if(!done){ done = true; resolve({ coords:null, errorCode:'timeout', errorMsg:'Zeitüberschreitung bei der Standortermittlung.' }); }
      }, timeoutMs);
      navigator.geolocation.getCurrentPosition(
        function(pos){
          if(done) return; done = true; clearTimeout(timer);
          resolve({ coords: pos.coords, errorCode:null, errorMsg:null });
        },
        function(err){
          if(done) return; done = true; clearTimeout(timer);
          var codes = { 1:'permission_denied', 2:'position_unavailable', 3:'timeout' };
          var msgs = {
            1:'Standortzugriff wurde für diese Seite verweigert (Browser-Website-Berechtigung prüfen).',
            2:'Standort konnte nicht ermittelt werden (GPS-Signal/Ortungsdienste prüfen).',
            3:'Zeitüberschreitung bei der Standortermittlung.'
          };
          resolve({ coords:null, errorCode: codes[err.code] || 'unknown', errorMsg: msgs[err.code] || err.message });
        },
        { enableHighAccuracy:true, timeout: timeoutMs, maximumAge: 0 }
      );
    });
  }

  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function loadImage(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  // burn a two-line caption (date/time + location) into the bottom of the photo
  function composePhoto(rawDataUrl, dateStr, locStr){
    return loadImage(rawDataUrl).then(function(img){
      var canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      var barH = Math.round(img.height * 0.10);
      ctx.fillStyle = 'rgba(15,15,15,0.72)';
      ctx.fillRect(0, img.height - barH, img.width, barH);

      var fs = Math.max(14, Math.round(barH * 0.34));
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'alphabetic';
      ctx.font = '600 ' + fs + 'px Inter, Arial, sans-serif';
      ctx.fillText(dateStr, img.width * 0.03, img.height - barH + barH * 0.42);
      var fs2 = Math.round(fs*0.9);
      ctx.font = '400 ' + fs2 + 'px Inter, Arial, sans-serif';
      while(fs2 > 10 && ctx.measureText(locStr).width > img.width * 0.94){
        fs2--; ctx.font = '400 ' + fs2 + 'px Inter, Arial, sans-serif';
      }
      ctx.fillText(locStr, img.width * 0.03, img.height - barH + barH * 0.82);

      return canvas.toDataURL('image/jpeg', 0.85);
    });
  }

  // ---------- screens ----------
  var screens = {
    start: document.getElementById('screen-start'),
    capture: document.getElementById('screen-capture'),
    done: document.getElementById('screen-done')
  };
  function showScreen(name){
    Object.keys(screens).forEach(function(k){
      screens[k].classList.toggle('active', k === name);
    });
    window.scrollTo(0,0);
  }

  // ---------- start screen ----------
  var inErfasser = document.getElementById('in-erfasser');
  var inBaustelle = document.getElementById('in-baustelle');
  var inKostenstelle = document.getElementById('in-kostenstelle');
  var btnStart = document.getElementById('btn-start');
  var startStatus = document.getElementById('start-status');

  function checkStartValid(){
    var ok = inErfasser.value.trim() && inBaustelle.value.trim() && inKostenstelle.value.trim();
    btnStart.disabled = !ok;
  }
  [inErfasser, inBaustelle, inKostenstelle].forEach(function(el){
    el.addEventListener('input', checkStartValid);
  });

  btnStart.addEventListener('click', function(){
    session = {
      erfasser: inErfasser.value.trim(),
      baustelle: inBaustelle.value.trim(),
      kostenstelle: inKostenstelle.value.trim()
    };
    photos = [];
    buildCaptureScreen();
    showScreen('capture');
    // trigger the location permission prompt now, ahead of the first photo,
    // so it doesn't collide with the camera opening
    if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(function(){}, function(){}, { timeout: 12000 }); }
  });

  // ---------- capture screen ----------
  var cameraInput = document.getElementById('camera-input');
  var galleryInput = document.getElementById('gallery-input');
  var captureRoot = document.getElementById('screen-capture');

  function buildCaptureScreen(){
    captureRoot.innerHTML =
      '<div class="session-strip">'+
        '<div class="row"><span><b>'+esc(session.erfasser)+'</b></span><span>'+esc(session.baustelle)+'</span></div>'+
        '<div class="row"><span>Kostenstelle</span><span>'+esc(session.kostenstelle)+'</span></div>'+
      '</div>'+
      '<div style="padding:18px 16px 0;">'+
        '<button class="btn btn-primary" id="btn-shoot">📷 &nbsp;Foto aufnehmen</button>'+
        '<button class="btn btn-outline" id="btn-gallery" style="margin-top:10px;">Foto aus Galerie wählen</button>'+
        '<div class="status-line" id="capture-status"></div>'+
        '<div class="count-line"><h2 id="photo-count-label">0 Fotos</h2><span>2 Fotos pro Zeile, 4 pro PDF-Seite</span></div>'+
        '<div id="photo-grid"></div>'+
        '<div class="sticky-bottom">'+
          '<button class="btn btn-dark" id="btn-finish" disabled>Kontrolle beenden &amp; PDF erstellen</button>'+
          '<button class="btn btn-text" id="btn-cancel" style="width:100%;margin-top:4px;">Kontrolle abbrechen</button>'+
        '</div>'+
      '</div>';

    document.getElementById('btn-shoot').addEventListener('click', function(){ startCapture('camera'); });
    document.getElementById('btn-gallery').addEventListener('click', function(){ startCapture('gallery'); });
    document.getElementById('btn-finish').addEventListener('click', finishAndGeneratePdf);
    document.getElementById('btn-cancel').addEventListener('click', function(){
      if(photos.length === 0 || confirm('Kontrolle wirklich abbrechen? Bereits aufgenommene Fotos gehen verloren.')){
        resetToStart();
      }
    });
    renderPhotos();
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function setCaptureStatus(msg, kind){
    var el = document.getElementById('capture-status');
    if(!el) return;
    el.textContent = msg || '';
    el.className = 'status-line' + (kind ? ' ' + kind : '');
  }

  var captureMode = 'camera';

  function startCapture(mode){
    if(busy) return;
    busy = true;
    captureMode = mode;
    setShootButtons(true);
    setCaptureStatus('');
    var input = mode === 'gallery' ? galleryInput : cameraInput;
    input.value = '';
    input.click();
    setTimeout(function(){
      if(busy){ busy = false; setShootButtons(false); setCaptureStatus(''); }
    }, 60000);
  }

  function setShootButtons(disabled){
    ['btn-shoot','btn-gallery'].forEach(function(id){
      var b = document.getElementById(id); if(b) b.disabled = disabled;
    });
  }

  // read GPS + capture time from the photo's own metadata (EXIF), if the OS left them in
  function readExif(file){
    if(!window.exifr) return Promise.resolve({ coords:null, taken:null });
    return window.exifr.parse(file, { gps:true, pick:['DateTimeOriginal','latitude','longitude','GPSHPositioningError'] })
      .then(function(d){
        if(!d) return { coords:null, taken:null };
        var coords = (typeof d.latitude === 'number' && typeof d.longitude === 'number' && !(d.latitude === 0 && d.longitude === 0))
          ? { latitude:d.latitude, longitude:d.longitude, accuracy: d.GPSHPositioningError || null }
          : null;
        var taken = d.DateTimeOriginal instanceof Date ? d.DateTimeOriginal : null;
        return { coords:coords, taken:taken };
      })
      .catch(function(){ return { coords:null, taken:null }; });
  }

  function handleFile(file){
    var mode = captureMode;
    if(!file){ busy = false; setShootButtons(false); setCaptureStatus(''); return; }

    setCaptureStatus('Foto wird verarbeitet, Standort wird ermittelt \u2026');
    Promise.all([readFileAsDataUrl(file), getLocation(), readExif(file)]).then(function(res){
      var rawDataUrl = res[0], live = res[1], exif = res[2];

      // camera shot: live device position first, photo metadata second
      // gallery pick: the photo's own metadata first (where/when it was really taken)
      var coords, source;
      if(mode === 'gallery'){
        if(exif.coords){ coords = exif.coords; source = 'Foto-Metadaten'; }
        else if(live.coords){ coords = live.coords; source = 'GPS beim Hochladen'; }
      } else {
        if(live.coords){ coords = live.coords; source = 'GPS'; }
        else if(exif.coords){ coords = exif.coords; source = 'Foto-Metadaten'; }
      }
      var when = (mode === 'gallery' && exif.taken) ? exif.taken : new Date();
      var dateStr = formatDateTime(when);
      var locStr = coords ? formatLocation(coords) + ' (' + source + ')' : formatLocation(null);
      var locError = coords ? null : (live.errorMsg || 'Keine GPS-Daten im Foto.');

      return composePhoto(rawDataUrl, dateStr, locStr).then(function(composed){
        photos.push({ dataUrl: composed, rawDataUrl: rawDataUrl, dateStr: dateStr, locStr: locStr, takenAt: when, locError: locError });
        renderPhotos();
        if(locError){
          setCaptureStatus('Foto ' + photos.length + ' gespeichert, ohne Koordinaten. GPS: ' + (live.errorMsg || 'nicht verfügbar') + ' Foto-Metadaten: keine Koordinaten enthalten.', 'err');
        } else {
          setCaptureStatus('Foto ' + photos.length + ' gespeichert (Koordinaten aus ' + source + ').', 'ok');
        }
      });
    }).catch(function(){
      setCaptureStatus('Foto konnte nicht verarbeitet werden. Bitte erneut versuchen.', 'err');
    }).finally(function(){
      busy = false;
      setShootButtons(false);
    });
  }

  cameraInput.addEventListener('change', function(e){ handleFile(e.target.files && e.target.files[0]); });
  galleryInput.addEventListener('change', function(e){ handleFile(e.target.files && e.target.files[0]); });

  function retryLocationForPhoto(idx){
    var p = photos[idx];
    if(!p) return;
    setCaptureStatus('Standort wird erneut ermittelt \u2026');
    getLocation().then(function(loc){
      if(!loc.coords){
        setCaptureStatus('GPS weiterhin nicht verfügbar: ' + loc.errorMsg, 'err');
        return;
      }
      var locStr = formatLocation(loc.coords) + ' (GPS nachträglich)';
      return composePhoto(p.rawDataUrl, p.dateStr, locStr).then(function(composed){
        photos[idx].dataUrl = composed;
        photos[idx].locStr = locStr;
        photos[idx].locError = null;
        renderPhotos();
        setCaptureStatus('Koordinaten ergänzt.', 'ok');
      });
    });
  }

  function renderPhotos(){
    var grid = document.getElementById('photo-grid');
    var label = document.getElementById('photo-count-label');
    var finishBtn = document.getElementById('btn-finish');
    if(!grid) return;

    label.textContent = photos.length + (photos.length === 1 ? ' Foto' : ' Fotos');
    finishBtn.disabled = photos.length === 0;

    if(photos.length === 0){
      grid.innerHTML = '<div class="empty-state">Noch keine Fotos. Auf „Foto aufnehmen“ tippen, um die Kontrolle zu dokumentieren.</div>';
      return;
    }
    grid.className = 'grid';
    grid.innerHTML = photos.map(function(p, i){
      var retryBtn = p.locError
        ? '<button class="retry-loc" data-idx="'+i+'">📍 GPS nachtragen</button>'
        : '';
      return '<div class="thumb">'+
               '<img src="'+p.dataUrl+'" alt="Foto '+(i+1)+'">'+
               '<button class="del" data-idx="'+i+'" aria-label="Foto entfernen">\u00d7</button>'+
               retryBtn+
             '</div>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('.del'), function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        photos.splice(idx, 1);
        renderPhotos();
      });
    });
    Array.prototype.forEach.call(grid.querySelectorAll('.retry-loc'), function(btn){
      btn.addEventListener('click', function(){
        retryLocationForPhoto(parseInt(btn.getAttribute('data-idx'), 10));
      });
    });
  }

  function resetToStart(){
    session = null;
    photos = [];
    inErfasser.value = ''; inBaustelle.value = ''; inKostenstelle.value = '';
    checkStartValid();
    startStatus.textContent = '';
    showScreen('start');
  }

  // ---------- PDF generation ----------
  function slug(s){
    return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  }

  function drawHeader(doc, pageW, createdAtStr){
    doc.setFillColor(226,87,13);
    doc.rect(0,0,pageW,3,'F');

    doc.setFont('helvetica','bold');
    doc.setFontSize(14);
    doc.setTextColor(28,28,28);
    doc.text('Franz Schelle GmbH & Co. KG', 15, 14);

    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    doc.setTextColor(100,100,100);
    doc.text('Kontrolle der Verkehrssicherung', 15, 19.5);

    var infoY = 28;
    doc.setFontSize(9);
    doc.setTextColor(40,40,40);
    doc.text('Erfasser/in: ' + session.erfasser, 15, infoY);
    doc.text('Baustelle: ' + session.baustelle, 15, infoY+5);
    doc.text('Kostenstelle: ' + session.kostenstelle, 15, infoY+10);
    doc.setTextColor(100,100,100);
    doc.text('Erstellt am: ' + createdAtStr, pageW-15, infoY, {align:'right'});

    doc.setDrawColor(226,87,13);
    doc.setLineWidth(0.6);
    doc.line(15, infoY+15, pageW-15, infoY+15);

    return infoY + 15 + 8;
  }

  function drawFooter(doc, pageW, pageH, pageNum, totalPages){
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(130,130,130);
    doc.text('Seite ' + pageNum + ' von ' + totalPages, pageW/2, pageH-10, {align:'center'});
  }

  function drawPhotoGrid(doc, pagePhotos, startY, pageW){
    var margin = 15;
    var gap = 8;
    var cellW = (pageW - margin*2 - gap) / 2;
    var cellH = 78;

    pagePhotos.forEach(function(p, i){
      var col = i % 2, row = Math.floor(i/2);
      var x = margin + col * (cellW + gap);
      var y = startY + row * (cellH + gap);

      var props = doc.getImageProperties(p.dataUrl);
      var ratio = Math.min(cellW / props.width, cellH / props.height);
      var w = props.width * ratio, h = props.height * ratio;
      var ox = x + (cellW - w) / 2, oy = y + (cellH - h) / 2;

      doc.setDrawColor(220,218,212);
      doc.setLineWidth(0.2);
      doc.rect(x, y, cellW, cellH);
      doc.addImage(p.dataUrl, 'JPEG', ox, oy, w, h);
    });
  }

  function buildPdfBlob(){
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit:'mm', format:'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var perPage = 4;
    var totalPages = Math.max(1, Math.ceil(photos.length / perPage));
    var createdAtStr = formatDateTime(new Date());

    for(var page = 0; page < totalPages; page++){
      if(page > 0) doc.addPage();
      var startY = drawHeader(doc, pageW, createdAtStr);
      var pagePhotos = photos.slice(page*perPage, page*perPage + perPage);
      drawPhotoGrid(doc, pagePhotos, startY, pageW);
      drawFooter(doc, pageW, pageH, page+1, totalPages);
    }
    return { blob: doc.output('blob'), totalPages: totalPages };
  }

  function savePdf(blob, filename){
    var useClaude = (typeof window.claude !== 'undefined' && window.claude && window.claude.use);
    var claudeAttempt = useClaude ? window.claude.use('downloads').catch(function(){ return null; }) : Promise.resolve(null);

    return claudeAttempt.then(function(downloads){
      if(downloads){
        return downloads.save({ filename: filename, data: blob }).then(function(){
          return true;
        }).catch(function(){
          return fallbackDownload(blob, filename);
        });
      }
      return fallbackDownload(blob, filename);
    });
  }

  function fallbackDownload(blob, filename){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    }catch(e){
      return false;
    }
  }

  function finishAndGeneratePdf(){
    if(photos.length === 0 || busy) return;
    busy = true;
    var finishBtn = document.getElementById('btn-finish');
    finishBtn.disabled = true;
    finishBtn.textContent = 'PDF wird erstellt \u2026';
    setCaptureStatus('');

    setTimeout(function(){
      try{
        var result = buildPdfBlob();
        var filename = 'Verkehrssicherung_' + slug(session.baustelle) + '_' + slug(formatDateTimeShort(new Date())) + '.pdf';
        savePdf(result.blob, filename).then(function(ok){
          busy = false;
          showDone(filename, result.totalPages, ok);
        });
      }catch(err){
        busy = false;
        finishBtn.disabled = false;
        finishBtn.textContent = 'Kontrolle beenden & PDF erstellen';
        setCaptureStatus('PDF konnte nicht erstellt werden. Bitte erneut versuchen.', 'err');
      }
    }, 30);
  }

  function showDone(filename, totalPages, saved){
    var el = document.getElementById('done-summary');
    el.innerHTML =
      '<div class="summary-row"><span>Baustelle</span><span>'+esc(session.baustelle)+'</span></div>'+
      '<div class="summary-row"><span>Erfasser/in</span><span>'+esc(session.erfasser)+'</span></div>'+
      '<div class="summary-row"><span>Kostenstelle</span><span>'+esc(session.kostenstelle)+'</span></div>'+
      '<div class="summary-row"><span>Fotos</span><span>'+photos.length+'</span></div>'+
      '<div class="summary-row"><span>Seiten</span><span>'+totalPages+'</span></div>'+
      '<div class="summary-row"><span>Datei</span><span style="word-break:break-all;">'+esc(filename)+'</span></div>' +
      (saved ? '' : '<div class="status-line err" style="text-align:left;padding-top:8px;">PDF konnte nicht automatisch gespeichert werden.</div>');
    showScreen('done');
  }

  document.getElementById('btn-new').addEventListener('click', resetToStart);

  window.addEventListener('beforeunload', function(e){
    if(photos.length > 0){
      e.preventDefault();
      e.returnValue = '';
    }
  });

})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
